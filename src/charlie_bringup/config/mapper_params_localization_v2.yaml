slam_toolbox:
  ros__parameters:
    # ---------------------------------------------------------
    # Configuración Base para Localización
    # ---------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    mode: localization                  # Estrictamente localización
    map_file_name: /home/miconra/mrad_ws_2601_charlie_repo/src/charlie_gazebo/real_slam_data/b_a_carrera_ser.data # IMPORTANTE: Ruta al archivo .posegraph
    map_start_pose: [0.0, 0.0, 0.0]     # Ajustar si el origen es distinto

    # ---------------------------------------------------------
    # Zona Segura: Optimización para Pure Pursuit y RPi 5
    # ---------------------------------------------------------
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    
    # Alta frecuencia para mantener el TF suave para Pure Pursuit
    transform_publish_period: 0.02     
    minimum_time_interval: 0.05 
    
    # Publicación del grid map casi nula para ahorrar CPU en la Pi 5
    map_update_interval: 10.0           

    # Retraso ligero tolerado por la red distribuida
    transform_timeout: 0.2              

    # ---------------------------------------------------------
    # Zona Segura: Criterios de actualización del Scan Matcher
    # ---------------------------------------------------------
    # Restringir las actualizaciones reduce los saltos abruptos
    minimum_travel_distance: 0.1        # Solo procesa si se movió 50cm
    minimum_travel_heading: 0.1         # Solo procesa si rotó ~28 grados
    use_scan_matching: true
    use_scan_barycenter: true

    # Ventana de búsqueda reducida para evitar saltos laterales (TF Jumps)
    localization_search_space_dimension: 0.1 

    # ---------------------------------------------------------
    # Zona de Peligro: Mantener defaults estrictamente
    # ---------------------------------------------------------
    resolution: 0.05
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.349
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03