twist_mux:
  ros__parameters:
    use_stamped: true # Set to true if using geometry_msgs/TwistStamped messages
    # Example input topics (adjust as needed)
    topics:
      navigation:
        topic   : cmd_vel_nav
        timeout : 0.5
        priority: 10
      joystick  : 
        topic   : cmd_vel_joy
        timeout : 0.5
        priority: 120
      startup:
        topic   : cmd_vel_start
        timeout : 0.5
        priority: 125  # HIGHEST PRIORITY - startup must override all other inputs
      keyboard  : 
        topic   : cmd_vel_keyboard
        timeout : 0.5
        priority: 50
      wall_following:
        topic   : cmd_vel_ctrl
        timeout : 0.5
        priority: 110
