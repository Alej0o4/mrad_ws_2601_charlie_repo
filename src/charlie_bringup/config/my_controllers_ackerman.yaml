controller_manager:
  ros__parameters:
    update_rate: 30

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_broadcaster_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

ackermann_controller:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: base_link
    enable_odom_tf: false


    # CRÍTICO: Debe ser false para que twist_mux y teleop_twist_joy funcionen por defecto
    use_stamped_vel: false
    reference_timeout: 0.5

    # Nombres de articulaciones del carro real
    traction_joints_names: ["leftb_wheel_joint", "rightb_wheel_joint"]
    steering_joints_names: ["left_steering_joint", "right_steering_joint"] # <--- CAMBIO AQUÍ

    # Geometría del chasis
    wheelbase: 0.257
    traction_track_width: 0.155
    steering_track_width: 0.155
    traction_wheels_radius: 0.053

    # Límites de comando (Mantienes los tuyos, están excelentes)
    linear:
      x:
        has_velocity_limits: true
        min_velocity: -10.0
        max_velocity:  10.0
        has_acceleration_limits: true
        min_acceleration: -1.0
        max_acceleration:  1.0
        has_jerk_limits: false

    angular:
      z:
        has_velocity_limits: true
        min_velocity: -4.0
        max_velocity:  4.0
        has_acceleration_limits: true
        min_acceleration: -5.0
        max_acceleration:  5.0
        has_jerk_limits: false