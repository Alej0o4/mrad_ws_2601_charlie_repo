controller_manager:
  ros__parameters:
    update_rate: 30

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_broadcaster_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

ackermann_controller:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: base_link
    enable_odom_tf: false

    # CRÍTICO: Debe ser false para que twist_mux y teleop_twist_joy funcionen por defecto
    use_stamped_vel: false
    reference_timeout: 0.5

    # Nombres de articulaciones (API Moderna de ROS 2 Jazzy)
    traction_joints_names: ["left_rear_wheel_joint", "right_rear_wheel_joint"]
    steering_joints_names: ["left_steering_wheel_joint", "right_steering_wheel_joint"]

    # Geometría del chasis
    wheelbase: 0.40
    traction_track_width: 0.64
    steering_track_width: 0.64
    traction_wheels_radius: 0.10

    # Límites de comando (Mantienes los tuyos, están excelentes)
    linear:
      x:
        has_velocity_limits: true
        min_velocity: -10.0
        max_velocity:  10.0
        has_acceleration_limits: true
        min_acceleration: -3.0
        max_acceleration:  3.0
        has_jerk_limits: false

    angular:
      z:
        has_velocity_limits: true
        min_velocity: -4.0
        max_velocity:  4.0
        has_acceleration_limits: true
        min_acceleration: -2.0
        max_acceleration:  2.0
        has_jerk_limits: false