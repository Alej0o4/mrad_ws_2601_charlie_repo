sysid_excitation_node:
  ros__parameters:
    interpolation_mode: "linear" 
    t_keys: [0.0, 2.0,  4.0,  6.0,  8.0]
    # Velocidad lineal constante a 0.5 m/s
    v_keys: [0.5, 0.5,  0.5,  0.5,  0.5] 
    # Zig-zag suave en la dirección (Rampas en el ángulo de Ackermann)
    w_keys: [0.0, 0.5, -0.5,  0.5,  0.0]