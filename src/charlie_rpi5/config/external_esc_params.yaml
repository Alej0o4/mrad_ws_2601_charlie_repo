yb_eb_external_esc_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_aebs
    steering_cmd_topic: /servo/steering_cmd
    esc_state_topic: /esc/cfoc_state
    imu_topic: /imu/data_raw
    mag_topic: /imu/mag
    voltage_topic: voltage

    wheelbase: 0.257
    min_linear_speed_for_delta: 0.05

    steering:
      ANGLE_MAX: 0.349
      LIMIT_PERCENT: 1.0
      PWM_MIN: 50.0
      PWM_MAX: 130.0
      PWM_CENTER: 90.0
      SERVO_CHANNEL: 2

    closed_loop_state_value: closed_loop
    buzzer_enabled: true
    buzzer_pulse_count: 2
    buzzer_pulse_ms: 100
    buzzer_pause_ms: 120

    min_battery_voltage: 11.4