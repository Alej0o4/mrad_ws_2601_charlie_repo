mpc_controller_node:
  ros__parameters:
    # ---------------------------------------------------------
    # Tópicos y Marcos de Referencia (Middleware)
    # ---------------------------------------------------------
    path_topic: "/smoothed_path"
    cmd_vel_topic: "/cmd_vel_nav"
    base_frame: "base_link"
    debug_topic: "~/debug/mpc_prediction"

    # ---------------------------------------------------------
    # Control General y TF
    # ---------------------------------------------------------
    control_rate_hz: 15.0
    goal_tolerance: 0.1
    tf_timeout_sec: 0.2

    # ---------------------------------------------------------
    # Parámetros del Horizonte de Predicción
    # ---------------------------------------------------------
    mpc_N: 7           # Horizonte (cantidad de pasos a predecir)
    mpc_dt: 0.1            # Tiempo de muestreo del modelo (segundos) aumentarlo lo hace lento pero sigue mejor, disminuirlo lo hace más reactivo pero puede ser inestable

    # ---------------------------------------------------------
    # Restricciones Cinemáticas (Límites Físicos del Robot)
    # ---------------------------------------------------------
    v_max: 4.75             # m/s
    v_min: -0.2            # m/s (Permite leve reversa si se pasa)
    omega_max: 1.5         # rad/s

    # ---------------------------------------------------------
    # Matrices de Pesos (Sintonización de la Función de Costo)
    # ---------------------------------------------------------
    # Q: Penalización de error de estado (Cross-track y Heading)
    weight_x: 1.0
    weight_y: 1.0
    weight_theta: 0.5      # Menos estricto con el ángulo para permitir curvas suaves
    
    # R: Penalización por uso de actuadores (Esfuerzo de control)
    weight_v: 0.01
    weight_omega: 0.1
    
    # R_d: Penalización por cambios bruscos (Suavizador de inercia/Jerk)
    weight_accel: 2.0      # Castiga aceleraciones/frenadas bruscas lineales
    weight_alpha: 2.0      # Castiga aceleraciones/frenadas bruscas angulares

    # ---------------------------------------------------------
    # Parámetro de debug
    # ---------------------------------------------------------
    debug: true
    use_joy_deadman_switch: true # Si es true, el robot solo se moverá si se recibe un comando de joystick específico