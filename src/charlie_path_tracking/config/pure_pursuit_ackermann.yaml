pure_pursuit_node:
  ros__parameters:
    path_topic: "/smoothed_path"
    cmd_vel_topic: "/cmd_vel_nav"
    base_frame: "base_link"
    
    control_rate_hz: 10.0
    v_nominal_pct: 0.11
    max_speed_pct: 0.11
    min_speed_pct: 0.05
    max_omega: 1.8       # Ajusta según la capacidad de giro de tu carro
    goal_tolerance: 0.1
    effort_to_ms_ratio: 9.0

    lookahead_L0: 0.6
    lookahead_kv: 0.15
    lookahead_min: 0.2
    lookahead_max: 0.7