pure_pursuit_node:
  ros__parameters:
    path_topic: "/smoothed_path"
    cmd_vel_topic: "/cmd_vel_nav"
    base_frame: "base_link"
    
    control_rate_hz: 30.0
    v_nominal_pct: 0.35  ##0.25
    max_speed_pct: 0.35  ##0.25 
    min_speed_pct: 0.05
    max_omega:  1.8 ##1.8       # Ajusta según la capacidad de giro de tu carro
    goal_tolerance: 0.1
    effort_to_ms_ratio: 4.5

    lookahead_L0: 1.4
    lookahead_kv: 0.5
    lookahead_min: 1.0
    lookahead_max: 2.0