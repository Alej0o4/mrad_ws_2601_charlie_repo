pure_pursuit_node:
  ros__parameters:
    path_topic: "/current_active_path"
    cmd_vel_topic: "/cmd_vel_nav"
    base_frame: "base_link"
    
    control_rate_hz: 10.0
    v_nominal: 0.15
    max_speed: 0.2
    max_omega: 1.8       # Ajusta según la capacidad de giro de tu carro
    goal_tolerance: 0.3

    lookahead_L0: 0.6
    lookahead_kv: 0.15
    lookahead_min: 0.4
    lookahead_max: 2.0